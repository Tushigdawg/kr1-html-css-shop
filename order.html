<section class="order">
    <div class="container">

        <h1>Place an order</h1>

        <form class="order-form">

            <div class="order-form__field">

                <label
                    class="order-form__label"
                    for="name"
                >
                    Name
                </label>

                <input
                    class="order-form__input"
                    type="text"
                    id="name"
                    name="name"
                    required
                >

            </div>


            <div class="order-form__field">

                <label
                    class="order-form__label"
                    for="email"
                >
                    E-mail
                </label>

                <input
                    class="order-form__input"
                    type="email"
                    id="email"
                    name="email"
                    required
                >

            </div>


            <div class="order-form__field">

                <label
                    class="order-form__label"
                    for="phone"
                >
                    Phone
                </label>

                <input
                    class="order-form__input"
                    type="tel"
                    id="phone"
                    name="phone"
                    required
                >

            </div>


            <div class="order-form__field">

                <label
                    class="order-form__label"
                    for="product"
                >
                    Product
                </label>

                <select
                    class="order-form__input"
                    id="product"
                    name="product"
                    required
                >
                    <option value="">
                        Select product
                    </option>

                    <option value="smartphone">
                        Smartphone Pro
                    </option>

                    <option value="laptop">
                        Laptop Air
                    </option>

                    <option value="headphones">
                        Wireless Headphones
                    </option>
                </select>

            </div>


            <div class="order-form__field">

                <label
                    class="order-form__label"
                    for="comment"
                >
                    Comment
                </label>

                <textarea
                    class="order-form__input"
                    id="comment"
                    name="comment"
                    rows="5"
                ></textarea>

            </div>


            <div class="order-form__field">

                <label>
                    <input
                        type="checkbox"
                        name="agreement"
                        required
                    >

                    I agree to the processing of my data
                </label>

            </div>


            <div class="order-form__actions">

                <button
                    type="submit"
                    class="button"
                >
                    Submit order
                </button>

            </div>

        </form>

    </div>
</section>
