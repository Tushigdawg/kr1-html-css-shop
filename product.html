<section class="product">
    <div class="container">

        <h1>Smartphone Pro</h1>

        <div class="product__content">

            <div class="product__image">
                <img
                    src="images/smartphone.jpg"
                    alt="Smartphone Pro"
                >
            </div>

            <div class="product__info">

                <p>
                    A modern smartphone designed for work,
                    entertainment and communication.
                </p>

                <p class="product-card__price">
                    €799
                </p>

                <a href="order.html" class="button">
                    Order product
                </a>

            </div>

        </div>


        <table class="product-table">

            <caption>
                Smartphone Pro characteristics
            </caption>

            <thead>
                <tr>
                    <th>Characteristic</th>
                    <th>Value</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Display</td>
                    <td>6.5 inch</td>
                </tr>

                <tr>
                    <td>Memory</td>
                    <td>256 GB</td>
                </tr>

                <tr>
                    <td>RAM</td>
                    <td>8 GB</td>
                </tr>

                <tr>
                    <td>Battery</td>
                    <td>5000 mAh</td>
                </tr>
            </tbody>

        </table>

    </div>
</section>

<button
    type="button"
    class="button"
    onclick="document.getElementById('orderModal').showModal()"
>
    Quick order
</button>


<dialog id="orderModal" class="modal">

    <h2>Quick order</h2>

    <p>
        Would you like to order this product?
    </p>

    <a href="order.html" class="button">
        Continue
    </a>

    <button
        type="button"
        onclick="document.getElementById('orderModal').close()"
    >
        Close
    </button>

</dialog>
